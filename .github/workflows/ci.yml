name: Rust & Vue CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The Android versionCode is `git rev-list --count HEAD`, and
          # actions/checkout defaults to a depth-1 clone, where that count is 1
          # on every single build. The in-app updater would then compare 1
          # against 1 and answer "up to date" forever — the exact failure this
          # versioning scheme exists to prevent. Full history is not optional.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Must agree with the `docker` job below: an APK from here and an APK from
      # the image have to describe themselves identically, or "is the server
      # newer?" becomes a coin toss. The docker job keeps the leading `v` in
      # PHOS_VERSION and the Dockerfile strips it, so both end at `1.2.3`.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            # Not a release, so do not claim to be one. `master+<short-sha>` is
            # honest and unique per build; the old empty value meant Gradle fell
            # back to its "1.0.0" default.
            name="${GITHUB_REF_NAME}+$(git rev-parse --short HEAD)"
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"
          # Monotonic on master, unlike anything derived from tags.
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Both properties are passed unconditionally. Passing only -PversionName —
      # as this job used to — left versionCode at Gradle's fallback of 1, so an
      # APK published from a tag could never supersede an installed one.
      - name: Build Android APKs
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon \
            "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Through the environment rather than inline `${{ }}`: the version name
          # embeds a git ref, which is attacker-controlled on a PR.
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Rename release APK for upload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/phos-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/phos-release.apk
          retention-days: 30

  # A CPU-only ComfyUI for the contract tests. The tag is the hash of the
  # Dockerfile, so an unchanged Dockerfile costs one manifest lookup and a
  # changed one (say, a COMFYUI_VERSION bump) rebuilds and pushes once.
  comfyui-test-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Name the image after the Dockerfile's content
        id: tag
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="$(sha256sum docker/comfyui-test/Dockerfile | cut -c1-12)"
          echo "image=ghcr.io/${owner}/comfyui-test:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether it is already published
        id: published
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.published.outputs.yes != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.published.outputs.yes != 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker/comfyui-test
          push: true
          tags: ${{ steps.tag.outputs.image }}

  # Every backend test in one job, one compilation: unit and integration tests
  # first, then the ComfyUI contract test against the image above. See
  # backend/tests/comfyui_contract_test.rs.
  backend-test:
    needs: comfyui-test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libavutil-dev libavformat-dev libavcodec-dev libavdevice-dev libavfilter-dev libswscale-dev libswresample-dev nasm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `cargo-v2-`: the v1 caches hold a bundled ffmpeg compiled with
      # -march=native on whichever runner filled them, which SIGILLs on any
      # other CPU. The build is portable now (see ffmpeg-sys-next in
      # backend/Cargo.toml); the prefix bump makes sure no v1 target/ is ever
      # restored again.
      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-v2-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-

      - name: Backend Tests
        run: |
          cd backend
          cargo test -- --test-threads=1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ComfyUI contract tests
        env:
          PHOS_COMFYUI_TEST_IMAGE: ${{ needs.comfyui-test-image.outputs.image }}
          RUST_LOG: info
        run: |
          cd backend
          cargo test --test comfyui_contract_test -- --nocapture

  # The image is built only from a commit whose tests passed and whose APK
  # built; the Dockerfile itself runs no tests.
  docker:
    needs: [backend-test, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # See build-android: a shallow clone makes `git rev-list --count HEAD`
          # return 1 forever, and the image would ship an APK that no installed
          # client ever considers newer.
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The `v` is kept; the Dockerfile strips it for the Android
            # versionName and the backend reports the tag verbatim.
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          # The Android versionCode. Same expression as build-android, so the
          # two jobs cannot disagree about which build is newer.
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PHOS_VERSION_CODE changes on every commit, so the android-builder
          # stage no longer reuses its cached layer across master pushes that
          # leave android/ untouched. That is inherent — the APK's identity has
          # to change when the image's does — and the stage's Gradle cache mount
          # absorbs most of the cost.
          build-args: |
            PHOS_VERSION=${{ steps.version.outputs.version }}
            PHOS_VERSION_CODE=${{ steps.version.outputs.version_code }}
          secrets: |
            keystore_password=${{ secrets.KEYSTORE_PASSWORD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-android, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Phos ${{ steps.version.outputs.version }}
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            See all tags on [GHCR](https://ghcr.io/${{ github.repository }}).

            ## Android

            Download the APK from the assets below.
          files: apk/*.apk
          generate_release_notes: true
