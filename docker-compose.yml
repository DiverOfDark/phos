services:
  phos:
    build:
      context: .
      args:
        PHOS_VERSION: "${PHOS_VERSION:-dev}"
        # The Android versionCode the bundled APK is built with, and the number
        # the in-app updater compares against. Left at the Dockerfile default of
        # 1 it never increases, so a compose self-hoster would never be offered
        # an update — silently. `git rev-list --count HEAD` is what CI uses.
        PHOS_VERSION_CODE: "${PHOS_VERSION_CODE:-1}"
    ports:
      - "33000:33000"
    volumes:
      - ./data/models:/app/models
      - ./data/library:/app/library
    environment:
      - RUST_LOG=info
      #- PHOS_DUMMY_AI=1  # Uncomment to skip AI model loading
      - PHOS_LIBRARY_PATH=/app/library
      ## OIDC SSO (uncomment and configure to enable authentication)
      #- PHOS_OIDC_ISSUER=https://auth.example.com/realms/phos
      #- PHOS_OIDC_CLIENT_ID=phos
      #- PHOS_OIDC_CLIENT_SECRET=your-client-secret
      #- PHOS_OIDC_REDIRECT_URI=https://phos.example.com/api/auth/callback
      #- PHOS_JWT_SECRET=your-random-secret
      #- PHOS_JWT_TTL=1209600  # session JWT lifetime in seconds, default 14 days
      #- PHOS_OIDC_SCOPES=openid profile email
      # MCP — generate the bearer token in Settings once the server is up
      #- PHOS_MCP_WRITE=1               # also expose the tools that change the library
      #- PHOS_PUBLIC_URL=https://phos.example.com  # shown as the /mcp endpoint in Settings
    restart: unless-stopped
